name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a day, the sweep asks vasm everything again rather than trusting the cache.
  schedule:
    - cron: "0 4 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain and targets from rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: echo "RASM_VASM=$(scripts/fetch-vasm.sh)" >> "$GITHUB_ENV"
      - run: echo "RASM_VLINK=$(scripts/fetch-vlink.sh)" >> "$GITHUB_ENV"
      - run: pipx install 'amitools[vamos]==0.8.1'
      - run: echo "RASM_VAMOS=$(command -v vamos)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y lhasa
      - run: echo "RASM_CORPUS=$(scripts/fetch-corpus.sh)" >> "$GITHUB_ENV"
      # Nearly all of the sweep's time is waiting for vasm, whose answers can't change unless
      # the sweep's lines or vasm do, so they are cached. The key only decides when to start a
      # new copy, because each entry is found by a hash of what vasm was given. They go in one
      # tar file, because actions/cache fails on this many files.
      - uses: actions/cache@v4
        if: github.event_name != 'schedule'
        with:
          path: ~/vasm-cache.tar
          key: vasm-answers-${{ hashFiles('scripts/fetch-vasm.sh', 'crates/rasm-one/tests/sweep_cpus.rs', 'crates/rasm-one/tests/vasm_opt_sweep.rs') }}
          restore-keys: vasm-answers-
      - if: github.event_name != 'schedule'
        run: |
          mkdir -p ~/vasm-cache
          if [ -f ~/vasm-cache.tar ]; then tar -xf ~/vasm-cache.tar -C ~/vasm-cache; fi
          echo "RASM_VASM_CACHE=$HOME/vasm-cache" >> "$GITHUB_ENV"
      # The sweep takes minutes unoptimised, so it runs only in the release build.
      - run: cargo test --workspace -- --skip test_assemble_sweep
      - run: cargo test --release -p rasm-one --test sweep_cpus
      - if: github.event_name != 'schedule'
        run: tar -cf ~/vasm-cache.tar -C ~/vasm-cache .
      - run: cargo test --release -p rasm-one --test perf_budget -- --nocapture
      - run: cargo build -p rasm-one -p rasm-one-wasm --target wasm32-unknown-unknown
      - run: scripts/wasm-smoke.sh
      - run: cargo doc -p rasm-one --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
